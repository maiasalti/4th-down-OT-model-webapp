# Render's free plan sleeps a web service after 15 minutes without traffic, and
# waking it takes 30-60 s. Pinging /health every 10 minutes keeps it awake.
# One always-on free service uses ~730 of the 750 free instance hours a month.
# Set the repository variable KEEP_WARM_URL to override the default URL.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.KEEP_WARM_URL || 'https://playbyplay.football/health' }}
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$URL") && [ "$code" = "200" ] && { echo "ok ($code)"; exit 0; }
            echo "attempt $i got ${code:-no response}"; sleep 10
          done
          exit 1
